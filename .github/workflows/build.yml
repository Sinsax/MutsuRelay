name: Build

on:
  push:
    branches: [main, master, test]
    tags: [v*]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Install Linux deps (for cargo check)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang libclang-dev libasound2-dev

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      # 纯源码校验，不需要编译产物（也避免 require 到 sherpa-onnx 那套重链接）
      - name: ABI version parity (lib.rs vs native_bridge.dart)
        run: python3 native/tools/check_abi.py

      - name: Cargo check (Linux)
        working-directory: native
        run: cargo check

  build-windows:
    runs-on: windows-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-msvc
          cache: true

      - name: Cache ASR model
        uses: actions/cache@v4
        with:
          path: asr/model
          key: asr-model-${{ hashFiles('cmake/download_model.cmake') }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Extract version
        shell: bash
        run: |
          ver=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "VERSION=$ver" >> $GITHUB_ENV

      - name: Build Flutter Windows (release)
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Create Inno Setup installer
        run: |
          # 不依赖 choco shim 是否进了 PATH，直接按 Inno Setup 6 的安装路径调用
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "找不到 $iscc" }
          & $iscc "/DMyAppVersion=$env:VERSION" windows\installer\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC 退出码 $LASTEXITCODE" }

      - name: Create ZIP package
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\mutsurelay-windows-x64.zip" -CompressionLevel Optimal

      - uses: actions/upload-artifact@v4
        with:
          name: mutsurelay-windows-x64
          path: dist\mutsurelay-windows-x64.zip
          compression-level: 0

      - uses: actions/upload-artifact@v4
        with:
          name: mutsurelay-windows-x64-installer
          path: dist\MutsuRelay-*.exe
          compression-level: 0

  build-linux:
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: true

      - name: Install Linux deps
        run: |
          sudo apt-get update
          # 注意包名：ubuntu-24.04 上既没有 `fuse`（改为 libfuse2t64/fuse3）也没有 `locate`
          # （由 plocate 提供）。这里两者都不需要 —— appimagetool 那一步用
          # APPIMAGE_EXTRACT_AND_RUN=1 运行，不依赖 FUSE。
          sudo apt-get install -y --no-install-recommends \
            clang libclang-dev \
            libgtk-3-dev \
            libasound2-dev \
            liblz4-dev \
            pkg-config \
            libayatana-appindicator3-dev \
            zlib1g-dev

      - name: Cache ASR model
        uses: actions/cache@v4
        with:
          path: asr/model
          key: asr-model-${{ hashFiles('cmake/download_model.cmake') }}

      - name: Flutter pub get
        run: flutter pub get

      - name: Extract version
        shell: bash
        run: |
          ver=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "VERSION=$ver" >> $GITHUB_ENV

      - name: Install appimagetool
        run: |
          wget -q "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -O /usr/local/bin/appimagetool
          chmod +x /usr/local/bin/appimagetool

      - name: Build Flutter Linux (release)
        run: flutter build linux --release

      - name: Create AppImage
        # 用仓库自己的打包脚本，不再另起一条 fastforge 路径：本地
        # `dart run tool/package.dart` 就是这么打的（手工拼 AppRun/.desktop/icon →
        # appimagetool，靠 APPIMAGE_EXTRACT_AND_RUN=1 绕开 FUSE 依赖）。
        # 历史上 2026-06-02 与 2026-09-18 两次 CI 失败都停在 fastforge 那一步，
        # 而同一份代码在本地脚本下能正常出包。
        run: dart run tool/package.dart
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1

      - name: Create Linux portable ZIP
        run: |
          mkdir -p dist
          cd build/linux/x64/release/bundle && zip -r $GITHUB_WORKSPACE/dist/mutsurelay-linux-x64.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: mutsurelay-linux-x64
          path: dist/mutsurelay-linux-x64.zip
          compression-level: 0

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find . -name "*.AppImage" -exec cp {} release-assets/mutsurelay-${{ env.VERSION }}-linux.AppImage \;

      - uses: actions/upload-artifact@v4
        with:
          name: mutsurelay-linux-x64-appimage
          path: release-assets/
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mutsurelay-windows-x64/*
            mutsurelay-windows-x64-installer/*
            mutsurelay-linux-x64/*
            mutsurelay-linux-x64-appimage/*
          generate_release_notes: true
